<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YODY ATS - Auto-fill CV & JD Matcher Studio</title>
    
    <!-- YODY Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine & Custom Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2a2b86',
                            dark: '#1e1f66',
                            tint: '#f0f1ff',
                        },
                        iris: {
                            DEFAULT: '#6366f1',
                            tint: '#eef2ff',
                        },
                        gold: '#fcaf16',
                        mint: '#10b981',
                        rose: '#ef4444',
                        mist: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-surface="app" class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- Top Sticky Header -->
    <header class="w-full bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-3 flex items-center justify-between shadow-xs shrink-0 h-[57px]">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="bg-[#fcaf16] text-slate-950 font-black px-2.5 py-0.5 rounded text-base tracking-wider font-display">YODY</span>
                <span class="text-[#2a2b86] font-extrabold text-base tracking-tight font-display">ATS</span>
            </div>
            <div class="hidden sm:block h-4 w-px bg-slate-200"></div>
            <span class="hidden sm:inline text-xs font-semibold text-slate-400 uppercase tracking-widest">Look Good - Feel Good</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-[#2a2b86] border border-indigo-100 font-mono">
                <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
                ✦ AI Active
            </span>
        </div>
    </header>

    <!-- 3-Column Studio Workspace -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden bg-slate-100 h-[calc(100vh-57px)]">
        
        <!-- COLUMN 1: Sidebar Input & Upload (25% Width) -->
        <aside class="w-full lg:w-72 xl:w-80 p-5 border-r border-slate-200 bg-white flex flex-col overflow-y-auto shrink-0 z-10 space-y-5">
            <div>
                <h2 class="text-sm font-extrabold text-slate-900 font-display">Tải file CV (PDF)</h2>
            </div>
            
            <!-- CV Upload Dropzone -->
            <div class="space-y-4">
                <div class="flex justify-center px-4 pt-6 pb-6 border-2 border-slate-200 border-dashed rounded-xl relative hover:bg-indigo-50/50 hover:border-indigo-400 fill-transition group cursor-pointer" id="dropzone">
                    <div class="space-y-2 text-center">
                        <div class="w-10 h-10 rounded-full bg-slate-100 group-hover:bg-indigo-100 flex items-center justify-center mx-auto fill-transition">
                            <svg class="w-5 h-5 text-[#2a2b86] group-hover:text-indigo-600 fill-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                        </div>
                        <div class="flex text-xs text-slate-900 justify-center font-medium">
                            <label for="cvFile" class="relative cursor-pointer font-bold text-[#2a2b86] hover:text-indigo-700 focus-within:outline-none fill-transition">
                                <span>Chọn file từ máy tính</span>
                                <input id="cvFile" name="cvFile" type="file" class="sr-only" accept="application/pdf">
                            </label>
                        </div>
                        <p class="text-[11px] text-slate-400" id="fileNameDisplay">Định dạng PDF (Tối đa 10MB)</p>
                    </div>
                </div>

                <!-- Extract Button -->
                <button id="extractBtn" class="btn-yody-ai w-full py-2.5 px-4 rounded-lg shadow-xs fill-transition flex items-center justify-center gap-2 text-xs font-semibold cursor-pointer">
                    <svg id="btnIcon" class="w-4 h-4 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span id="btnText">Trích xuất CV</span>
                </button>
            </div>
        </aside>

        <!-- COLUMN 2: Candidate Profile Canvas (45% Width - Scrollable) -->
        <main class="flex-1 p-6 overflow-y-auto bg-slate-100 relative space-y-5" id="formPane">
            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-xs z-20 hidden flex-col items-center justify-center fill-transition">
                <div class="w-10 h-10 rounded-full border-4 border-slate-100 border-t-[#2a2b86] animate-spin mb-3"></div>
                <p class="text-xs font-bold text-[#2a2b86]">Đang bóc tách dữ liệu CV...</p>
            </div>

            <form class="max-w-4xl mx-auto space-y-5" id="candidateForm">
                <!-- Profile Header Banner -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <div class="avatar-yody shrink-0" id="avatarInitials">YD</div>
                    <div class="flex-1 w-full space-y-3">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <input type="text" id="form-fullName" class="text-lg font-extrabold text-slate-900 font-display bg-transparent border-b border-transparent focus:border-[#2a2b86] outline-none w-full" placeholder="Họ và Tên ứng viên" readonly>
                                <input type="text" id="form-currentTitle" class="text-xs font-semibold text-[#2a2b86] bg-transparent border-b border-transparent focus:border-[#2a2b86] outline-none w-full mt-0.5" placeholder="Vị trí hiện tại" readonly>
                            </div>
                            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-indigo-50 text-[#2a2b86] border border-indigo-100 shrink-0 font-mono">
                                <span>Tháng KN:</span>
                                <input type="text" id="form-totalExperienceMonths" class="w-8 bg-transparent text-center font-bold outline-none" value="0" readonly>
                            </div>
                        </div>

                        <!-- Contact & Links Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-xs">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">Email</label>
                                <input type="email" id="form-email" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">Số điện thoại</label>
                                <input type="text" id="form-phone" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">Địa điểm</label>
                                <input type="text" id="form-location" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">LinkedIn</label>
                                <input type="text" id="form-link-linkedin" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">GitHub</label>
                                <input type="text" id="form-link-github" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase font-mono">Portfolio</label>
                                <input type="text" id="form-link-portfolio" class="w-full text-xs font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 outline-none focus:bg-white" placeholder="--" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tóm tắt nghề nghiệp -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-2">
                    <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider">Tóm tắt nghề nghiệp</h3>
                    <textarea id="form-professionalSummary" rows="3" class="w-full rounded-lg border-slate-200 bg-slate-50 px-3 py-2 border outline-none text-xs font-medium focus:bg-white focus:border-[#2a2b86] resize-none" placeholder="Chưa có thông tin" readonly></textarea>
                </div>

                <!-- Kỹ năng & Ngoại ngữ -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider mb-2.5">Kỹ năng cốt lõi</h3>
                        <div id="form-skills" class="flex flex-wrap gap-2 rounded-lg p-1 min-h-[36px]"></div>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider mb-2.5">Ngoại ngữ</h3>
                        <div id="form-languages" class="flex flex-wrap gap-2 rounded-lg p-1 min-h-[36px]"></div>
                    </div>
                </div>

                <!-- Kinh nghiệm làm việc Timeline -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3">
                    <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider">Kinh nghiệm làm việc</h3>
                    <div id="form-experience" class="timeline-container"></div>
                </div>

                <!-- Dự án, Học vấn & Chứng chỉ -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3">
                        <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider">Dự án tham gia</h3>
                        <div id="form-projects" class="space-y-3"></div>
                    </div>
                    <div class="space-y-5">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3">
                            <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider">Học vấn</h3>
                            <div id="form-education" class="space-y-3"></div>
                        </div>
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs space-y-3">
                            <h3 class="text-xs font-bold text-slate-900 border-l-4 border-[#2a2b86] pl-2.5 uppercase font-display tracking-wider">Chứng chỉ</h3>
                            <div id="form-certifications" class="space-y-3"></div>
                        </div>
                    </div>
                </div>
            </form>
        </main>

        <!-- COLUMN 3: AI JD Matcher Inspector (30% Width - Scrollable) -->
        <aside class="w-full lg:w-80 xl:w-[360px] p-5 border-l border-slate-200 bg-white flex flex-col overflow-y-auto shrink-0 space-y-5">
            <div>
                <h2 class="text-sm font-extrabold text-slate-900 font-display">JD Matcher</h2>
            </div>

            <!-- JD Preset Actions -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase font-mono">Mẫu JD</label>
                    <div class="flex gap-1.5">
                        <button type="button" class="jd-template-btn px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded text-[11px] font-bold fill-transition cursor-pointer" data-type="pass">✓ Đạt</button>
                        <button type="button" class="jd-template-btn px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded text-[11px] font-bold fill-transition cursor-pointer" data-type="fail">✗ Không Đạt</button>
                    </div>
                </div>
                <textarea id="jdInput" rows="6" class="w-full rounded-lg border-slate-200 bg-slate-50 px-3 py-2 border outline-none text-xs font-medium focus:bg-white focus:border-[#2a2b86]" placeholder="Dán nội dung Job Description (JD)..."></textarea>
                
                <button type="button" id="matchBtn" class="btn-yody-ai w-full py-2.5 px-4 rounded-lg shadow-xs fill-transition flex items-center justify-center gap-2 text-xs font-semibold cursor-pointer">
                    <span>Chấm điểm độ phù hợp</span>
                </button>
            </div>

            <!-- Match Results Panel -->
            <div id="matchResult" class="pt-4 border-t border-slate-200 hidden fill-transition space-y-4">
                <!-- Score Radial Gauge -->
                <div class="flex flex-col items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="relative w-24 h-24">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-slate-200" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="scorePath" class="text-[#2a2b86] transition-all duration-1000 ease-out" stroke-dasharray="0, 100" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center flex-col">
                            <span id="scoreText" class="text-xl font-extrabold text-slate-900 font-display">0%</span>
                        </div>
                    </div>
                    <div id="recommendationBadge" class="mt-2.5 px-3 py-1 rounded-full text-xs font-bold text-center font-mono">Chờ kết quả...</div>
                </div>

                <!-- Pros (Điểm mạnh) -->
                <div class="bg-emerald-50/60 p-3 rounded-xl border border-emerald-200">
                    <h4 class="text-[11px] font-bold text-emerald-800 uppercase tracking-wider mb-2 flex items-center gap-1.5 font-mono">
                        <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Điểm mạnh
                    </h4>
                    <ul id="prosList" class="space-y-1 text-xs font-medium text-slate-700"></ul>
                </div>

                <!-- Cons (Thiếu sót) -->
                <div class="bg-rose-50/60 p-3 rounded-xl border border-rose-200">
                    <h4 class="text-[11px] font-bold text-rose-800 uppercase tracking-wider mb-2 flex items-center gap-1.5 font-mono">
                        <svg class="w-3.5 h-3.5 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Thiếu sót
                    </h4>
                    <ul id="consList" class="space-y-1 text-xs font-medium text-slate-700"></ul>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
