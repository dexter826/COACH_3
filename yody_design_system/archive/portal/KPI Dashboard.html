<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KPI Dashboard · BSC CN&CĐS · T6/2026</title>
  <link rel="stylesheet" href="ds/tokens.css" />
  <link rel="stylesheet" href="ds/dashboard.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #fcfcff; }
  </style>
</head>
<body data-ds-v3 data-surface="portal">
  <div id="root" data-ds-v3 data-surface="portal"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data + selector layer (plain JS — maps to src/data/*.ts) -->
  <script src="ds/data.js"></script>
  <script src="ds/selectors.js"></script>

  <!-- Components + island (JSX — maps to _components/*.tsx) -->
  <script type="text/babel" src="ds/components-core.jsx"></script>
  <script type="text/babel" src="ds/components-grid.jsx"></script>
  <script type="text/babel" src="ds/components-zones.jsx"></script>
  <script type="text/babel" src="ds/components-panel.jsx"></script>
  <script type="text/babel" src="ds/app.jsx"></script>
</body>
</html>
