<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mạng lưới KPI · YODY</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--fg-1);
    background: var(--bg-2);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root, .kg-root { position: fixed; inset: 0; }

  /* ── canvas surface ── */
  .kg-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none;
    background:
      radial-gradient(120% 120% at 50% 0%, #ffffff 0%, var(--bg-2) 60%, #eef0f8 100%);
  }
  .kg-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    box-shadow: inset 0 0 220px rgba(42,43,134,0.06);
  }

  .kg-root > :not(.kg-canvas):not(.kg-vignette) { z-index: 5; }

  /* ── top bar ── */
  .kg-topbar {
    position: absolute; top: 16px; left: 16px; right: 16px; height: 56px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 10px 0 14px;
    background: rgba(252,252,255,0.82);
    backdrop-filter: blur(14px) saturate(1.3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  .kg-brand { display: flex; align-items: center; gap: 11px; }
  .kg-logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
    position: relative;
  }
  .kg-logo::after {
    content: ""; position: absolute; inset: 0; border-radius: 8px;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), transparent 45%),
      radial-gradient(circle at 72% 70%, var(--gold) 0 3px, transparent 4px);
  }
  .kg-titles { line-height: 1.1; }
  .kg-title { font: 700 16px/1.1 var(--font-body); letter-spacing: -0.01em; color: var(--fg-1); }
  .kg-sub { font: 500 11px/1.3 var(--font-mono); color: var(--fg-3); margin-top: 3px; letter-spacing: 0.01em; white-space: nowrap; }

  .kg-search {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    width: min(340px, 38vw); height: 40px; padding: 0 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-pill);
    color: var(--fg-3); transition: border-color var(--dur), box-shadow var(--dur);
  }
  .kg-search:focus-within { border-color: var(--iris); box-shadow: var(--focus-ring); }
  .kg-search svg { flex: none; }
  .kg-search input {
    border: 0; outline: 0; background: transparent; width: 100%;
    font: 400 14px/1 var(--font-body); color: var(--fg-1);
  }
  .kg-search input::placeholder { color: var(--fg-3); }

  .kg-zoomreadout {
    display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    padding: 0 12px 0 6px; border-left: 1px solid var(--border-light); align-self: stretch; justify-content: center;
  }
  .kg-zoomreadout span { font: 600 9px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
  .kg-zoomreadout b { font: 700 14px/1 var(--font-mono); color: var(--brand); font-variant-numeric: tabular-nums; }

  /* ── legend / filter ── */
  .kg-legend {
    position: absolute; left: 16px; top: 88px; width: 244px;
    background: rgba(252,252,255,0.86); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); padding: 12px;
  }
  .kg-legend-head, .kg-rel-head, .kg-legend-foot {
    font: 700 10px/1 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3);
  }
  .kg-legend-head { margin: 2px 4px 10px; }
  .kg-legend-list { display: flex; flex-direction: column; gap: 2px; }
  .kg-chip {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 8px 10px; border: 0; background: transparent; cursor: pointer;
    border-radius: var(--radius-sm); text-align: left; transition: background var(--dur-fast), opacity var(--dur-fast);
    font: 500 13px/1.2 var(--font-body); color: var(--fg-1);
  }
  .kg-chip:hover { background: var(--bg-muted); }
  .kg-chip.off { opacity: 0.36; }
  .kg-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .kg-chip-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kg-chip-count { font: 600 11px/1 var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
  .kg-clear {
    margin: 8px 4px 2px; padding: 5px 0; border: 0; background: transparent; cursor: pointer;
    font: 600 11px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--iris-deep);
  }
  .kg-clear:hover { text-decoration: underline; }
  .kg-legend-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 7px; }
  .kg-foot-row { display: flex; align-items: center; gap: 8px; font: 500 11px/1.2 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--fg-2); }
  .kg-edge-tree, .kg-edge-rel { width: 22px; height: 0; flex: none; }
  .kg-edge-tree { border-top: 1.5px solid var(--border-hover); }
  .kg-edge-rel { border-top: 1.5px dashed var(--iris); }

  /* ── hover hint ── */
  .kg-hint {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 9px; max-width: 60vw;
    padding: 8px 14px; background: var(--bg-ink); color: #fff;
    border-radius: var(--radius-pill); box-shadow: var(--shadow-lg);
    font: 500 13px/1.2 var(--font-body); pointer-events: none;
  }
  .kg-hint-lv { font: 700 9.5px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6); }

  /* ── zoom controls ── */
  .kg-zoom {
    position: absolute; left: 16px; bottom: 22px; display: flex; flex-direction: column; gap: 6px;
  }
  .kg-zoom button {
    width: 44px; height: 44px; border: 1px solid var(--border); background: rgba(252,252,255,0.9);
    backdrop-filter: blur(10px); border-radius: var(--radius-sm); cursor: pointer;
    font: 400 22px/1 var(--font-body); color: var(--fg-1); box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center; transition: background var(--dur-fast), border-color var(--dur-fast);
  }
  .kg-zoom button:hover { background: #fff; border-color: var(--border-hover); }
  .kg-zoom button:focus-visible { outline: 0; box-shadow: var(--focus-ring); }
  .kg-zoom .kg-fit { font-size: 17px; color: var(--brand); }

  /* ── detail panel ── */
  .kg-panel {
    position: absolute; top: 88px; right: 16px; bottom: 22px; width: 366px;
    background: rgba(252,252,255,0.92); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-lg); overflow: hidden;
    transform: translateX(calc(100% + 24px)); opacity: 0;
    transition: transform var(--dur-slow) var(--ease-out), opacity var(--dur-slow) var(--ease-out);
    pointer-events: none;
  }
  .kg-panel.open { transform: none; opacity: 1; pointer-events: auto; }
  .kg-panel-inner { height: 100%; overflow-y: auto; padding: 20px 22px 24px; }
  .kg-panel-inner::-webkit-scrollbar { width: 8px; }
  .kg-panel-inner::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 9999px; }
  .kg-panel-close {
    position: absolute; top: 14px; right: 14px; width: 32px; height: 32px;
    border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm);
    cursor: pointer; font: 300 20px/1 var(--font-body); color: var(--fg-2);
    display: flex; align-items: center; justify-content: center;
  }
  .kg-panel-close:hover { background: var(--bg-muted); color: var(--fg-1); }
  .kg-panel-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 2px 30px 12px 0; }
  .kg-crumb { border: 0; background: transparent; padding: 0; cursor: pointer; font: 500 12px/1.3 var(--font-body); color: var(--fg-3); }
  .kg-crumb:hover { color: var(--iris-deep); text-decoration: underline; }
  .kg-crumb-sep { color: var(--border-hover); margin: 0 1px; font-size: 11px; }
  .kg-panel-title { font: 700 22px/1.22 var(--font-body); letter-spacing: -0.015em; color: var(--fg-1); margin: 0 0 12px; text-wrap: balance; }
  .kg-panel-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .kg-tag {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill);
    font: 600 12px/1 var(--font-body); background: var(--bg-muted); color: var(--fg-2);
  }
  .kg-tag.mono { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0.02em; background: var(--bg-2); color: var(--fg-3); }
  .kg-tag.tone-live { background: var(--live-bg); color: var(--mint-deep); }
  .kg-tag.tone-plan { background: var(--plan-bg); color: var(--plan-deep); }
  .kg-tag.tone-gap  { background: var(--gap-bg);  color: var(--gap); }

  .kg-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-light); border: 1px solid var(--border-light); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 18px; }
  .kg-metric { background: var(--bg); padding: 11px 12px; }
  .kg-metric-label { font: 600 9.5px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 6px; }
  .kg-metric-val { font: 800 26px/1 var(--font-numeric); color: var(--fg-1); font-variant-numeric: tabular-nums; }
  .kg-metric-val small { font: 600 12px/1 var(--font-body); color: var(--fg-3); margin-left: 1px; }
  .kg-metric-val.muted { color: var(--fg-3); }
  .kg-metric-val.up { color: var(--mint-deep); }
  .kg-metric-val.down { color: var(--gap); }
  .kg-progress { grid-column: 1 / -1; background: var(--bg); padding: 12px; }
  .kg-progress-track { position: relative; height: 8px; background: var(--bg-muted); border-radius: 9999px; overflow: visible; }
  .kg-progress-fill { height: 100%; border-radius: 9999px; }
  .kg-progress-target { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--fg-2); transform: translateX(-1px); }
  .kg-progress-cap { font: 500 11px/1 var(--font-body); color: var(--fg-3); margin-top: 8px; }

  .kg-rel-head { margin: 4px 0 10px; }
  .kg-rel-head b { color: var(--iris-deep); }
  .kg-rel-list { display: flex; flex-direction: column; gap: 2px; }
  .kg-rel-item {
    display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: 0; background: transparent; cursor: pointer; border-radius: var(--radius-sm);
    text-align: left; transition: background var(--dur-fast);
  }
  .kg-rel-item:hover { background: var(--bg-muted); }
  .kg-rel-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 13px/1.3 var(--font-body); color: var(--fg-1); }
  .kg-rel-lv { font: 600 9.5px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); flex: none; }
  .kg-rel-empty { font: 400 13px/1.5 var(--font-body); color: var(--fg-3); padding: 8px 10px; }

  @media (max-width: 760px) {
    .kg-legend { display: none; }
    .kg-panel { width: auto; left: 16px; }
    .kg-search { width: 180px; }
    .kg-zoomreadout { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .kg-panel { transition: none; }
  }

  /* Standalone-only: floating button to open Tweaks (no platform toolbar offline) */
  .kg-tweaks-fab {
    position: absolute; left: 16px; bottom: 178px; z-index: 6;
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 16px;
    background: var(--brand); color: #fff; border: 0; border-radius: var(--radius-pill);
    font: 600 13px/1 var(--font-body); cursor: pointer;
    box-shadow: var(--shadow-lg); transition: background var(--dur-fast), transform var(--dur-fast);
  }
  .kg-tweaks-fab:hover { background: var(--brand-light); transform: translateY(-1px); }
  .kg-tweaks-fab:focus-visible { outline: 0; box-shadow: var(--focus-ring); }
</style>
</head>
<body data-surface="app">
  <div id="root"></div>

  <!-- DS data + canvas engine (vanilla) -->
  <script src="kpi-graph-data.js"></script>
  <script src="kpi-graph-engine.js"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks shell + app -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="kpi-graph-app.jsx"></script>
</body>
</html>
